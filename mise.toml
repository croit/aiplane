# mise — toolchain + task runner for the LLM gateway project.
# Run `mise install` once after cloning, then use `mise run <task>` for everything.
# Docs: https://mise.jdx.dev/

[tools]
# `components` rides on mise's Rust plugin (which uses rustup under
# the hood) — no separate `rustup component add` step needed at any
# install site, CI or local. See https://mise.jdx.dev/lang/rust.html.
rust = { version = "1.95", components = "rustfmt,clippy,cargo" }
# cargo-binstall is what mise uses behind the `cargo:` backend to install Rust
# binaries quickly (pre-built when available, source-build as fallback).
cargo-binstall = "latest"
# sccache wraps rustc to cache compilation artifacts. Optional and OFF by
# default — no `RUSTC_WRAPPER` is set here. Local devs can opt in by setting
# `RUSTC_WRAPPER=sccache` (and configuring a backend, e.g. local disk or S3).
# CI does not use sccache; GitHub Actions caches the cargo registry + target/
# via Swatinem/rust-cache instead.
"cargo:sccache" = "latest"
# cargo-nextest is the workspace test runner (`mise run test`). It runs the
# ~37 integration-test binaries with far more parallelism than `cargo test`
# and gives a compact per-test report. Kept in the committed toolset (not
# just mise.local.toml) so CI's `mise install` provisions it before
# `mise run ci` → `test`. Note: nextest does not run doctests; the codebase
# has none that execute (the only ` ``` ` fences are `text` blocks), so no
# separate `cargo test --doc` step is needed. Add one here if that changes.
"cargo:cargo-nextest" = "latest"
# Node builds the SvelteKit SPA in `web/` and runs the `node:test`-driven
# suites in `web/src/lib` (unit) and `e2e/` (browser).
node = "24"
# Playwright, used only by the `e2e` task (browser-driven end-to-end tests).
# Installed as a mise tool so there's no project-local node_modules; the e2e
# task points `PLAYWRIGHT_DIR` at this install via `mise where`. Pinned to
# match the fallback path baked into `e2e/helpers.mjs`.
"npm:@playwright/cli" = "0.1.13"
# `typst` CLI for the `typst_<template>` tools. Resolved through
# mise's registry (aqua → GitHub releases), so platform detection
# is mise's problem. `mise run fetch-typst-cli` then copies the
# installed binary into target/release/typst for the runtime image.
typst = "0.15.0"
# gitleaks backs the `secrets` / `secrets-staged` tasks: the pre-commit hook
# and CI's `secrets` job. In the committed toolset (not mise.local.toml) so
# `mise install` provisions it for every clone and for CI — a scanner only
# some developers have is not a gate. Deliberately NOT the official
# gitleaks-action, which requires a paid licence key for organisations.
gitleaks = "8.30"

[env]
RUST_BACKTRACE = "1"
RUST_LOG = "info,gateway=debug,gateway_core=debug,gateway_features=debug,gateway_runtime=debug,gateway_tools=debug,gateway_api=debug"
# Secrets (API keys, tokens) go in the gitignored `mise.local.toml`, not
# here. Web-search settings are the exception in the other direction: they
# live in the DB and are set under "Web search" on /admin/models (the legacy
# SEARCH_PROVIDER / SEARXNG_URL / BRAVE_SEARCH_API_KEY vars are imported once
# at first boot, then ignored). For the optional GeoIP
# auto-updater (the `get_user_location` tool), set the IP2Location LITE
# download token in `mise.local.toml`; `gateway.toml`'s `[geoip]
# update_token_env` names which var to read (default below):
# IP2LOCATION_TOKEN = "<your-ip2location-lite-token>"   # ← in mise.local.toml

[tasks.test-nextcloud]
description = "LIVE E2E for the fileshare RAG WebDAV provider against a real Nextcloud in a throwaway container. Never runs in normal CI or `cargo test` — the test binary is gated behind RUN_NEXTCLOUD_E2E and skips without it. Verifies the assumptions the mocked tests cannot: that oc:fileid really survives a move, and that a collection etag really changes and propagates when something beneath it changes (subtree pruning is built on that). Needs docker or podman. First run pulls ~600 MB and waits ~60-90 s for Nextcloud to install itself."
run = """
set -eu

CONTAINER="${NEXTCLOUD_E2E_CONTAINER:-gw-nextcloud-e2e}"
PORT="${NEXTCLOUD_E2E_PORT:-8099}"
IMAGE="${NEXTCLOUD_E2E_IMAGE:-docker.io/library/nextcloud:31-apache}"
USER_NAME="admin"
PASSWORD="admin-password-e2e"

# podman is drop-in here; prefer whichever exists.
if command -v podman >/dev/null 2>&1; then RUNTIME=podman
elif command -v docker >/dev/null 2>&1; then RUNTIME=docker
else
  echo "need docker or podman to run the live Nextcloud test" >&2
  exit 1
fi

# Always tear down, including on failure or Ctrl-C: a stray container
# holding the port makes the next run fail with something unhelpful.
cleanup() {
  if [ "${NEXTCLOUD_E2E_KEEP:-}" = "1" ]; then
    echo "leaving $CONTAINER running (NEXTCLOUD_E2E_KEEP=1) on http://127.0.0.1:$PORT"
  else
    $RUNTIME rm -f "$CONTAINER" >/dev/null 2>&1 || true
  fi
}
trap cleanup EXIT INT TERM

$RUNTIME rm -f "$CONTAINER" >/dev/null 2>&1 || true
echo "starting $IMAGE as $CONTAINER on port $PORT ..."
# SQLite: no second container, and the corpus here is a handful of files.
$RUNTIME run -d --name "$CONTAINER" \
  -p "127.0.0.1:$PORT:80" \
  -e SQLITE_DATABASE=nextcloud \
  -e NEXTCLOUD_ADMIN_USER="$USER_NAME" \
  -e NEXTCLOUD_ADMIN_PASSWORD="$PASSWORD" \
  -e NEXTCLOUD_TRUSTED_DOMAINS="127.0.0.1 localhost" \
  "$IMAGE" >/dev/null

# Nextcloud installs itself on first boot; until that finishes it answers
# 503 or redirects to the setup wizard. Poll the DAV endpoint we actually
# use rather than the front page, so we wait for the thing under test.
echo -n "waiting for Nextcloud to finish installing"
DAV="http://127.0.0.1:$PORT/remote.php/dav/files/$USER_NAME/"
for _ in $(seq 1 120); do
  CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "$USER_NAME:$PASSWORD" \
    -X PROPFIND -H 'Depth: 0' "$DAV" || true)
  if [ "$CODE" = "207" ]; then echo " ready."; break; fi
  echo -n "."
  sleep 2
done
if [ "${CODE:-}" != "207" ]; then
  echo ""
  echo "Nextcloud did not become ready (last status: ${CODE:-none}). Container logs:" >&2
  $RUNTIME logs --tail 40 "$CONTAINER" >&2 || true
  exit 1
fi

# --test-threads=1: the tests share one Nextcloud and each manages its own
# folder, but the server's etag propagation is what we are measuring and
# concurrent writes elsewhere in the tree would muddy it.
RUN_NEXTCLOUD_E2E=1 \
NEXTCLOUD_URL="http://127.0.0.1:$PORT" \
NEXTCLOUD_USER="$USER_NAME" \
NEXTCLOUD_PASS="$PASSWORD" \
  cargo test -p gateway --test nextcloud_e2e_live -- --nocapture --test-threads=1
"""
dir = "{{ config_root }}"

[tasks.dev]
description = "Run the gateway (debug build) against the local config: the API, the proxy, and the built SPA. Pair with `mise run dev-web` in another terminal for the Vite dev server on :5173 (HMR, no Rust rebuild on UI changes)."
depends = ["build-web"]
run = """
# GATEWAY_SESSION_KEY is mandatory (the gateway refuses to boot without it —
# see load_session_secret in crates/gateway/src/main.rs). Generate one on first
# run and reuse it forever after, so a dev restart no longer logs you out AND
# secrets sealed into the local gateway.sqlite (backend API keys, connector
# secrets, OAuth tokens) stay readable across restarts. Previously dev ran on an
# ephemeral key, so every one of those was silently lost on every restart.
KEY_FILE=".gateway-dev-session-key"
if [ ! -f "$KEY_FILE" ]; then
  openssl rand -hex 32 > "$KEY_FILE"
  chmod 600 "$KEY_FILE"
  echo "generated a persistent dev session key at $KEY_FILE (gitignored)"
fi
# GATEWAY_STATIC_DIR serves the SvelteKit SPA from the `mise run build-web`
# output. A missing directory is harmless — only the UI
# then 503s, the rest of the gateway is unaffected. Override with your own
# path (e.g. a prebuilt copy) to point at a different build.
exec env GATEWAY_STATIC_DIR="${GATEWAY_STATIC_DIR:-target/frontend/build}" GATEWAY_SESSION_KEY="$(cat "$KEY_FILE")" cargo run --package gateway
"""
dir = "{{ config_root }}"

[tasks.dev-build]
description = "Debug build only — produces target/debug/gateway. Use this for fast iteration loops (typical ~2 s incremental vs ~11 s for a release build). For deploys / benchmarks use `mise run build` instead."
run = "cargo build --package gateway --bin gateway"

[tasks.build]
description = "Release build of the gateway binary. Slow (~12 s cold incremental, ~70 s from clean) — only use this when you actually want optimised output (deploys, perf measurement). For day-to-day work use `mise run dev` or `mise run dev-build`."
depends = ["fetch-typst-cli", "fetch-pdfium"]
run = "cargo build --release --package gateway --bin gateway"

[tasks.fetch-typst-cli]
description = "Copy mise's installed `typst` CLI into target/release/typst so the runtime Dockerfile picks it up via the same artifact pipeline that ships the gateway binary. The version + download URL are mise's responsibility — see the `typst` entry under [tools]."
run = """
set -eu
mkdir -p target/release
install -m 0755 "$(mise which typst)" target/release/typst
target/release/typst --version
"""

[tasks.fetch-pdfium]
description = "Download the prebuilt pdfium shared library (Chromium's PDF engine, BSD-3) into target/release/ so the runtime Dockerfile COPYs it (PDFIUM_LIB_PATH) and the fetch_attachment PDF reader's image tier (scanned PDFs → page images) works out of the box. Mirrors fetch-typst-cli: rides the same artifact pipeline as the gateway binary. Pinned to PDFIUM_TAG — bump = edit one line. Cached via a tag-stamp sidecar so repeat release builds don't re-download."
run = """
set -eu
# Bump this to upgrade pdfium. Tags: https://github.com/bblanchon/pdfium-binaries/releases
PDFIUM_TAG="chromium/7891"
case "$(uname -s)-$(uname -m)" in
  Linux-x86_64)  asset=pdfium-linux-x64.tgz;   lib=libpdfium.so ;;
  Linux-aarch64) asset=pdfium-linux-arm64.tgz; lib=libpdfium.so ;;
  Darwin-arm64)  asset=pdfium-mac-arm64.tgz;   lib=libpdfium.dylib ;;
  Darwin-x86_64) asset=pdfium-mac-x64.tgz;     lib=libpdfium.dylib ;;
  *) echo "fetch-pdfium: unsupported platform $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac
mkdir -p target/release
stamp="target/release/.pdfium-tag"
if [ -f "target/release/$lib" ] && [ "$(cat "$stamp" 2>/dev/null || true)" = "$PDFIUM_TAG" ]; then
  echo "fetch-pdfium: target/release/$lib already at $PDFIUM_TAG — skipping"
  exit 0
fi
url="https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/$asset"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
curl -fsSL "$url" -o "$tmp/pdfium.tgz"
tar -xzf "$tmp/pdfium.tgz" -C "$tmp" "lib/$lib"
install -m 0644 "$tmp/lib/$lib" "target/release/$lib"
printf '%s' "$PDFIUM_TAG" > "$stamp"
ls -lh "target/release/$lib"
"""

[tasks.web-install]
description = "Install web/ node_modules (SvelteKit SPA). Re-runs only when package.json/lock change."
sources = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]
run = "npm --prefix web ci --no-audit --no-fund"

[tasks.dev-web]
description = "SvelteKit dev server (Vite, :5173) with /api, /v1, /auth proxied to the gateway on :8080 — run alongside `mise run dev`. HMR on save; no Rust rebuild on UI changes."
depends = ["web-install"]
run = "npm --prefix web run dev"

[tasks.build-web]
description = "Build the SvelteKit SPA (adapter-static) into target/frontend/build/. The Dockerfile COPYs that directory into the image; the gateway serves it from the root when GATEWAY_STATIC_DIR points there."
depends = ["web-install"]
sources = ["web/src/**/*", "web/static/**/*", "web/vite.config.ts", "web/package.json"]
outputs = ["target/frontend/build/index.html"]
run = """
set -eu
# Start from a clean output tree. A `vite build` over a previous one can leave
# the emitted index.html and the JS chunks disagreeing about SvelteKit's
# per-build global (`__sveltekit_<id>`) — the bootstrap then reads `.data` off
# an undefined global and the app dies on load with a blank page and a single
# console exception. Nothing downstream catches that: the files are all
# present, so the build "succeeds" and every e2e page assertion fails at once.
rm -rf web/build
npm --prefix web run build

# Prove the build is internally consistent before shipping it.
html_id=$(grep -o '__sveltekit_[a-z0-9]*' web/build/index.html | sort -u)
js_id=$(grep -roh '__sveltekit_[a-z0-9]*' web/build/_app | sort -u)
if [ "$html_id" != "$js_id" ]; then
  echo "torn SPA build: index.html uses '$html_id' but the JS uses '$js_id'." >&2
  echo "The app would load to a blank page. Remove web/.svelte-kit and rebuild." >&2
  exit 1
fi

rm -rf target/frontend
mkdir -p target/frontend
cp -r web/build target/frontend/build
"""

[tasks.check-web]
description = "svelte-check (typescript + a11y + Svelte diagnostics) across web/src."
depends = ["web-install"]
sources = ["web/src/**/*", "web/vite.config.ts"]
run = "npm --prefix web run check"

[tasks.dev-ui]
description = "Stub gateway for local UI debugging: real rama server on :8080 against a wiremock chat + transcription backend with a pre-seeded session. Prints the session cookie to stdout so playwright (or curl) can drive any authed page (/, /tokens, /chat, /api/v0/*) without OIDC. See docs/dev-workflow.md → 'Debugging the UI'."
run = "cargo run --example dev_ui -p gateway"

[tasks.test]
description = "Run the workspace tests (cargo-nextest — parallel, compact report)."
run = "cargo nextest run --workspace"

[tasks.test-nocapture]
description = "Run tests with stdout/stderr visible."
run = "cargo nextest run --workspace --no-capture"

[tasks.parity-gap]
description = "Report .ftl keys with no consumer — the size of the SPA's feature gap against the UI it replaced. See docs/spa-parity-gap.md."
run = "python3 web/scripts/parity-gap.py"

[tasks.gen-locales]
description = "Regenerate web/src/lib/locales/*.ts from the Fluent catalogs in crates/session-core/locales. The .ftl files are canonical for BOTH halves of the product — the server still renders some strings itself — so a translation is added there and flows to the SPA from here. Run after touching any .ftl."
sources = ["crates/session-core/locales/**/*.ftl"]
outputs = ["web/src/lib/locales/en.ts"]
dir = "{{ config_root }}"
run = "python3 web/scripts/ftl-to-ts.py"

[tasks.test-web]
description = "Unit-test the SvelteKit SPA's TypeScript (node --test, Node's own type stripping). Tests live next to their module as `*.test.ts` in web/src/lib — the pure, framework-free halves of the SPA (chat event protocol, markdown), so they pin wire behaviour without jsdom."
sources = ["web/src/lib/**/*.ts"]
dir = "{{ config_root }}"
run = "node --test 'web/src/lib/**/*.test.ts'"

[tasks.lint]
description = "Clippy + rustfmt + svelte-check."
depends = ["check-web"]
run = [
    "cargo fmt --all -- --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.lint-panics]
description = "Advisory: flag panic-prone `.unwrap()`/`.expect()` in library/binary code (warnings only — NOT part of `ci`). The main `lint` gate runs clippy with `-D warnings`, so promoting these workspace-wide would turn every one of the ~2000 existing (mostly test/mutex/infallible) sites into a hard error. This task instead surfaces them as warnings so new panic sites in request-handling paths are visible in review without a mass rewrite. Excludes test targets (`--all-targets` is intentionally omitted)."
run = "cargo clippy --workspace -- -W clippy::unwrap_used -W clippy::expect_used"

[tasks.secrets]
description = "Scan the whole git history for committed secrets (gitleaks). Run by CI's `secrets` job and by the pre-push hook."
# Scans commit patches, not the working tree, so target/ and other build
# output never enter the picture. ~1.3 s over this repo's history.
# Rules + allowlist come from .gitleaks.toml, which gitleaks picks up from
# the target path automatically.
run = "gitleaks git . --redact --no-banner"

[tasks.secrets-staged]
description = "Scan only the staged diff for secrets (gitleaks). Run by the pre-commit hook; use before committing anything credential-shaped."
run = "gitleaks git . --staged --redact --no-banner"

[tasks.ci]
description = "Everything CI runs: lint + tests + release build of the gateway binary + SPA build. mise fans out via the DAG. Locally prefer `verify` — same gate, minus the release build you don't need."
depends = ["lint", "test", "test-web", "build", "build-web"]

[tasks.verify]
description = "The local pre-push gate: lint + Rust tests + SPA checks and build. Same checks as `ci` minus the release build — nothing in `ci` catches a compile error that `test` doesn't, and the release build is a THIRD full compile of the workspace (dev for clippy, test for nextest, release for the binary). Run this once before pushing; use `test-crate` / `lint-crate` while iterating."
depends = ["lint", "test", "test-web", "build-web"]

[tasks.test-crate]
description = "Tests for ONE crate — the iteration loop. `mise run test-crate gateway-api [filter]`. Seconds instead of the ~20 min a full `test` costs after touching a root crate, because it links that crate's test binaries only."
usage = '''
arg "<crate>" help="workspace crate, e.g. gateway-api"
arg "[filter]" help="optional nextest name filter"
'''
run = 'cargo nextest run -p "$usage_crate" ${usage_filter:-}'

[tasks.lint-crate]
description = "Clippy for ONE crate: `mise run lint-crate gateway-api`. Use while iterating; `mise run verify` before pushing."
usage = 'arg "<crate>" help="workspace crate, e.g. gateway-api"'
run = 'cargo clippy -p "$usage_crate" --all-targets -- -D warnings'

[tasks.e2e]
description = "Browser + HTTP end-to-end tests (Playwright via node:test). Needs `mise run dev` running in another terminal. Not part of `ci`. Set CHROMIUM_HEADED=1 to watch the browser, GATEWAY_URL=… to target a remote gateway. See e2e/README.md for first-time Chromium setup."
dir = "{{ config_root }}"
run = """
set -eu
# Point the tests at the mise-installed playwright regardless of where mise
# put it (the hardcoded fallback in e2e/helpers.mjs is the CI host's path).
# Honour a pre-set PLAYWRIGHT_DIR so a caller can override it.
export PLAYWRIGHT_DIR="${PLAYWRIGHT_DIR:-$(mise where 'npm:@playwright/cli')/lib/node_modules/@playwright/cli/node_modules/playwright}"
node --test e2e/*.test.mjs
"""

[tasks.fmt]
description = "Apply rustfmt across the workspace."
run = "cargo fmt --all"

[tasks.setup-hooks]
description = "One-time per clone: enable the version-controlled git hooks in .githooks/ (pre-commit secret scan, pre-push CI gate, commit-msg trailer check) and mark target/ so the OS indexer leaves it alone."
run = """
set -eu
git config core.hooksPath .githooks
# Keep macOS Spotlight out of target/. A build writes hundreds of thousands of
# files; left unmarked, `mds`/`mdworker` index every one of them and burn real
# CPU during every compile (measured here: ~8 k .rmeta files already indexed,
# mds + mds_stores at 60% CPU mid-build). The marker file is what Spotlight
# looks for to skip a directory tree; it is harmless on Linux.
mkdir -p target
touch target/.metadata_never_index
echo "hooks enabled; target/ marked non-indexable"
"""

[tasks.sweep-target]
description = "Reclaim target/: delete build artifacts nothing has rebuilt in N days (default 14). Cargo has NO garbage collector — every fingerprint change (a profile flag, a feature, a dep bump, a branch switch, a toolchain update) writes a new artifact set and keeps the old one forever. This directory reached 1.16M files / 327 GB here, of which 99% was superseded garbage, and at that size a plain `ls` of target/debug/deps took 66 s — a tax cargo pays on every single invocation. Run it when target/ gets uncomfortable; the pre-push hook also kicks it off in the background at most weekly."
usage = 'arg "[days]" help="delete artifacts older than this many days (default 14)"'
run = """
set -eu
days="${usage_days:-14}"
root="{{config_root}}/target"
[ -d "$root" ] || { echo "no target/ yet — nothing to sweep"; exit 0; }

# Only cargo's own artifact directories. NEVER the top of target/release: it
# also holds binaries fetched by `fetch-typst-cli` / `fetch-pdfium`, which no
# rebuild would put back and which the container image build needs.
swept=0
for profile in debug release; do
    for sub in deps build incremental .fingerprint; do
        dir="$root/$profile/$sub"
        [ -d "$dir" ] || continue
        before=$(find "$dir" -type f 2>/dev/null | wc -l | tr -d " ")
        find "$dir" -type f -mtime "+$days" -delete 2>/dev/null || true
        find "$dir" -type d -empty -delete 2>/dev/null || true
        after=$(find "$dir" -type f 2>/dev/null | wc -l | tr -d " ")
        echo "$profile/$sub: $before -> $after files"
        swept=$((swept + before - after))
    done
done
date -u +%Y-%m-%dT%H:%M:%SZ > "$root/.last-sweep"
echo "swept $swept files older than ${days}d"
"""

[tasks.check]
description = "Fast type-check across the workspace (no codegen). The cheapest rung of the ladder: check → test-crate/lint-crate → verify → ci."
run = "cargo check --workspace --all-targets"

