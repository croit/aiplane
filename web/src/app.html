<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=gateway-v1" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#1d1d1b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<script>
			// Theme before first paint: the gateway's chrome reads a
			// `theme` cookie ("light"/"dark", see session_core::chrome).
			// No cookie → follow the OS preference (what the legacy page's
			// `media="(prefers-color-scheme: …)"` meta did). Applying it
			// here — before CSS resolves — avoids a flash-of-wrong-theme.
			(() => {
				const m = document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/);
				document.documentElement.dataset.theme =
					m ? m[1] : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

				// Language, same story: `$lib/i18n` resolves the `lang` cookie
				// then the browser's own preference list, and the app fixes up
				// `<html lang>` once it mounts. Doing it here too means the
				// attribute is right for the *first* paint, which is what a
				// screen reader announcing the page and the browser's
				// hyphenation and spellcheck actually read.
				const langs = ['en', 'de', 'fr', 'es', 'ru', 'zh'];
				const c = document.cookie.match(/(?:^|;\s*)lang=([a-zA-Z-]+)/);
				const wanted = [c && c[1], ...(navigator.languages || [])]
					.map((tag) => tag && tag.split('-')[0].toLowerCase())
					.find((tag) => langs.includes(tag));
				if (wanted) document.documentElement.lang = wanted;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
