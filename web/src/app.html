<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Theme before first paint: the gateway's chrome reads a
			// `theme` cookie ("light"/"dark", see session_core::chrome).
			// Applying it here — before CSS resolves — avoids a
			// flash-of-wrong-theme on every hard load of the SPA.
			(() => {
				const m = document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/);
				document.documentElement.dataset.theme = m ? m[1] : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
