# CI for the rama-based LLM gateway (GitHub Actions).
#
# Pipeline shape (mirrors the previous GitLab pipeline):
#   1. ci        — one job runs lint + tests + release build via `mise run ci`,
#                  sharing a single target/ so deps compile once. Uploads the
#                  gateway + typst binaries as artifacts.
#   2. container — builds the runtime image (thin Dockerfile that just COPYs the
#                  artifacts; the CSS + datastar.js are baked into the binary via
#                  include_bytes!). On pull requests it builds with --no-push to
#                  validate the Dockerfile; on the default branch and tags it
#                  pushes to GHCR.
#
# Toolchain + tasks come from mise.toml (jdx/mise-action installs Rust, Node,
# typst, etc. and caches them). The old GitLab pipeline wrapped rustc in an
# S3-backed sccache on croit-internal runners; that's dropped here in favour of
# Swatinem/rust-cache (GitHub's cache backend) so the workflow needs no secrets
# beyond the built-in GITHUB_TOKEN.
#
# Every `uses:` is pinned to a full 40-character commit SHA, with the release
# it corresponds to in a trailing comment. A tag like `@v6` is mutable — the
# publisher (or anyone who compromises their account) can re-point it at any
# commit, which then runs inside jobs holding `packages: write` and the GHCR
# push token. That is how tj-actions/changed-files was backdoored in March
# 2025; a SHA cannot be re-pointed. Dependabot (.github/dependabot.yml) opens
# the bump PRs so the pins stay current — update them THERE, and never replace
# a SHA with a tag to "simplify" this file.

name: CI

on:
  push:
    branches: [main]
    # Release tags only: `vYYMM.RELEASE.BUILD` (docs/releases.md). Any other
    # tag would reach `scripts/derive-version.sh`, which refuses to name a
    # build after something that is not a version.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  IMAGE: ghcr.io/croit/llm-gateway
  # Companion images for the code-execution sandbox feature (see docs/sandbox.md).
  IMAGE_SANDBOX: ghcr.io/croit/llm-gateway-sandbox
  IMAGE_RUNNER: ghcr.io/croit/llm-gateway-sandbox-runner
  # PDF-aware OCR adapter (deploy/ocr-sidecar). Optional at runtime, but it has
  # to exist as an image: Kubernetes pulls, it cannot build from a context the
  # way `docker compose` does.
  IMAGE_OCR: ghcr.io/croit/llm-gateway-ocr-sidecar
  # The Helm chart is published as an OCI artifact into the same registry as
  # the images, so `helm install oci://…/llm-gateway --version <v>` needs no
  # checkout of this repository.
  CHART_REPO: oci://ghcr.io/croit/charts
  # The workspace compiles 2-3x in one job (clippy debug + test debug +
  # release build) and lumis pulls in ~116 tree-sitter grammars, so the
  # default-runner disk fills up. Dropping debuginfo from the dev/test
  # profiles roughly halves target/ size. The root Cargo.toml already trims it
  # (`line-tables-only` for workspace crates, none for dependencies) so local
  # builds get most of this; these go one step further — env beats the
  # manifest — because the runner wants disk, not backtraces with line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Secret scanning, kept as its own job so it reports in ~30 s instead of
  # waiting on the multi-minute Rust build, and so its failure is unambiguous.
  # This is the backstop for the local pre-commit/pre-push hooks: it also
  # covers commits pushed with `--no-verify` or from a clone where
  # `mise run setup-hooks` was never run — the exact path by which an internal
  # bearer token once reached this public repo's history.
  #
  # Deliberately not gitleaks/gitleaks-action: that action requires a paid
  # licence key for organisation-owned repos. The binary from mise.toml has no
  # such restriction, and sharing `mise run secrets` with the hooks means the
  # gate can't drift from what developers run locally.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing — `mise run secrets` scans commit
      # history, and the default shallow checkout would hand it a single
      # commit and pass vacuously.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # install_args limits this to gitleaks; pulling the full toolset (Rust,
      # Node, typst) would cost minutes for a 1.3 s scan.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: gitleaks

      - name: mise run secrets
        run: mise run secrets

  # One resolver for the whole pipeline. Every artifact (three images, the OCR
  # sidecar, the Helm chart) is stamped from this single output, so they can
  # never disagree about what build they belong to. The scheme and the rules
  # live in docs/releases.md.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      # fetch-depth: 0 is load-bearing: `derive-version.sh` reads the git tags,
      # and it deliberately FAILS on a shallow clone rather than invent a
      # number that would mislabel every artifact of this run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: derive
        run: |
          set -e
          # Assign, then export/emit — `X=$(...)` propagates the script's
          # failure, whereas embedding it in another command swallows it.
          V=$(sh scripts/derive-version.sh)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: \`$V\`" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest ships ~25 GB of preinstalled SDKs we don't use; the big
      # multi-profile Rust compile otherwise runs the runner out of disk
      # ("No space left on device"). Reclaim it up front.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      # Installs the toolchain pinned in mise.toml (Rust + components, Node,
      # typst, cargo-binstall) and caches it across runs.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Belt-and-suspenders: mise.toml requests the rustfmt/clippy components,
      # but on the GitHub runner (which ships its own rustup) that doesn't
      # always take, so `cargo fmt`/`clippy` via the pinned toolchain fail.
      # Add them explicitly to the mise-selected toolchain.
      - name: Ensure rustfmt + clippy
        run: mise exec -- rustup component add rustfmt clippy

      # Caches the cargo registry/git deps + target/ keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `mise run ci` fans out lint (fmt + clippy -D warnings + tsc) + tests +
      # release build through mise's DAG (each transitively builds the CSS/JS
      # bundles). Produces target/release/gateway.
      - name: mise run ci
        env:
          # build.rs embeds this as the §13 "Source" commit in the UI. Without
          # it, build.rs falls back to `git rev-parse` (also fine here).
          GIT_SHA: ${{ github.sha }}
        run: mise run ci

      # The sandbox-runner ships as its own image (COPY-prebuilt, like the
      # gateway) so its image build needs no Rust toolchain. Deps are already
      # warm from `mise run ci`, so this is a fast incremental compile.
      - name: Build sandbox-runner binary
        run: mise exec -- cargo build --release -p sandbox-runner

      - run: ls -lh target/release/gateway target/release/sandbox-runner

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-binaries
          path: |
            target/release/gateway
            target/release/sandbox-runner
            target/release/typst
            target/release/libpdfium.so
          retention-days: 7
          if-no-files-found: error

      # The SvelteKit SPA build (adapter-static output, staged into
      # target/frontend/build/ by the `build-web` mise task). A separate
      # artifact because it is a whole directory the container job COPYs;
      # `gateway-binaries` is executables-only.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-spa
          path: target/frontend/build/
          retention-days: 7
          if-no-files-found: error

  container:
    name: container image
    # Gated on `secrets` as well as `ci`: a red secret scan must not be able to
    # publish an image to GHCR, or the leak ends up baked into a pulled artifact
    # where rewriting git history no longer reaches it.
    needs: [secrets, ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile COPYs the binaries built by the `ci` job — it does not
      # compile anything. Pull them back into target/release/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateway-binaries
          path: target/release

      # Same for the SPA build — the Dockerfile COPYs target/frontend/build
      # (staged there by the `build-web` mise task in the `ci` job).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateway-spa
          path: target/frontend/build

      # upload-artifact does not preserve the executable bit; restore it so the
      # COPYed /app/gateway is runnable.
      - name: Restore executable bits
        run: chmod +x target/release/gateway target/release/typst

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `v<derived version>` on EVERY build is what lets a chart pin one
          # number and find the matching image whether it came from a release
          # tag or from main. `production` is the moving "latest official
          # release" pointer and is owned by tag builds alone — `latest` stays
          # the rolling main build. One owner per moving tag, no races.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=production,enable=${{ github.ref_type == 'tag' }}
          # metadata-action derives org.opencontainers.image.description from the
          # GitHub repo's description, which is empty here — so the package page on
          # GHCR reads "No description provided". Set the OCI labels explicitly so
          # the description (and a readable title) ship with every pushed image
          # regardless of the repo's About field. `source`/`url`/`revision` are
          # still filled in automatically by metadata-action.
          labels: |
            org.opencontainers.image.title=LLM Gateway
            org.opencontainers.image.description=Authenticated, OpenAI-API-compatible LLM gateway — multi-backend routing, OIDC login, per-user API tokens, RBAC-gated server-side tools, RAG, and a built-in chat UI. One Rust binary, SQLite for state.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      # Only authenticate when we're actually going to push (not on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR: build only (validate the Dockerfile). Branch/tag: build + push.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Becomes GATEWAY_VERSION in the image; the gateway reads it at
          # runtime (gateway-api/src/build_info.rs) and reports it at
          # /api/v0/build, which is what the UI's version line shows.
          build-args: |
            GATEWAY_VERSION=${{ needs.version.outputs.version }}

  # Sandbox companion images. These are large (LibreOffice + Chromium + the
  # data/science stack) and self-contained (no Rust artifact needed for the
  # gold image), so they only build+push on `push` to main/tags — not on every
  # PR — to keep PR CI fast. Validate Containerfile changes locally with
  # `docker build` (see docs/sandbox.md). amd64 (the llm01 target); the
  # Containerfiles are arch-aware (TARGETARCH) if multi-arch is added later.
  sandbox-image:
    name: sandbox gold image
    # Gated on `secrets` as well as `ci`: a red secret scan must not be able to
    # publish an image to GHCR, or the leak ends up baked into a pulled artifact
    # where rewriting git history no longer reaches it.
    needs: [secrets, ci, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gold image is multi-GB (LibreOffice, Chromium, scipy/sklearn/…);
      # reclaim the runner's preinstalled SDKs so the build doesn't run out of
      # disk.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_SANDBOX }}
          # `v<derived version>` on EVERY build is what lets a chart pin one
          # number and find the matching image whether it came from a release
          # tag or from main. `production` is the moving "latest official
          # release" pointer and is owned by tag builds alone — `latest` stays
          # the rolling main build. One owner per moving tag, no races.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=production,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=LLM Gateway Sandbox
            org.opencontainers.image.description=Batteries-included workload image for the LLM gateway code-execution sandbox — python + data/science stack, LibreOffice, pandoc, typst, ffmpeg, duckdb, ripgrep/jq, tshark, tesseract OCR, headless Chromium. Runs under gVisor (runsc) / crun.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sandbox-image
          file: sandbox-image/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sandbox-runner-image:
    name: sandbox runner image
    # Gated on `secrets` as well as `ci`: a red secret scan must not be able to
    # publish an image to GHCR, or the leak ends up baked into a pulled artifact
    # where rewriting git history no longer reaches it.
    needs: [secrets, ci, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # COPY-prebuilt, like the gateway image: pull the binary the `ci` job
      # built and restore its executable bit (upload-artifact drops it).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateway-binaries
          path: target/release
      - name: Restore executable bit
        run: chmod +x target/release/sandbox-runner

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_RUNNER }}
          # `v<derived version>` on EVERY build is what lets a chart pin one
          # number and find the matching image whether it came from a release
          # tag or from main. `production` is the moving "latest official
          # release" pointer and is owned by tag builds alone — `latest` stays
          # the rolling main build. One owner per moving tag, no races.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=production,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=LLM Gateway Sandbox Runner
            org.opencontainers.image.description=Privileged helper for the LLM gateway sandbox — spawns single-use, gVisor-isolated sandboxes (holds the podman socket); the gateway talks to it over HTTP.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-stage Containerfile compiles the runner from the workspace, so the
      # context is the repo root (target/ is excluded via .dockerignore).
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/sandbox-runner/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The OCR sidecar. It exists as a Containerfile that `docker compose` builds
  # from a context — which Kubernetes cannot do, it only pulls. So it is built
  # and published here like any other component. amd64 only, matching the other
  # images; the Containerfile is arch-neutral (python:slim + PyMuPDF) if
  # multi-arch is ever wanted.
  ocr-sidecar-image:
    name: ocr sidecar image
    needs: [secrets, ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_OCR }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=production,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=LLM Gateway OCR Sidecar
            org.opencontainers.image.description=PDF-aware adapter between the LLM gateway's internal /ocr contract and an Unlimited-OCR vLLM server — converts PDFs page by page with PyMuPDF and calls the model with its request recipe.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR: build only (validate the Containerfile). Branch/tag: build + push.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/ocr-sidecar
          file: deploy/ocr-sidecar/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The Chrome extension. Built on every run so a change that breaks packaging
  # is caught by a pull request, uploaded to the Web Store only on a release
  # tag — the store rejects a version that is not greater than the published
  # one, so there is no such thing as a "main build" of an extension.
  extension:
    name: chrome extension
    needs: [secrets, ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `mise run package-extension` stamps the version from the tags.
          fetch-depth: 0

      # Node alone: packaging is a copy, a JSON edit and a zip.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node@24

      - name: mise run package-extension
        id: package
        run: echo "zip=$(mise run package-extension | tail -1)" >> "$GITHUB_OUTPUT"

      # Kept whatever happens, so a release always has the exact artefact that
      # was submitted — the store shows you what is live, not what you sent.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension
          path: ${{ steps.package.outputs.zip }}

      # `secrets` cannot be read from a step's `if`, so the presence of the
      # credentials becomes an output first.
      - name: Are we able to publish?
        id: creds
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$CWS_SERVICE_ACCOUNT" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      # Skipped rather than failed when the credentials are absent: a fork, and
      # this repository before somebody sets the secrets up, should still get a
      # green build and the artefact above.
      - name: Publish to the Chrome Web Store
        if: github.ref_type == 'tag' && steps.creds.outputs.have == 'true'
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-extension.mjs "${{ steps.package.outputs.zip }}"

      - name: Summary
        env:
          V: ${{ needs.version.outputs.version }}
          HAVE_CREDENTIALS: ${{ steps.creds.outputs.have }}
        run: |
          {
            echo "### Chrome extension $V"
            echo
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "Built only — extensions are published from release tags."
            elif [ "$HAVE_CREDENTIALS" = "true" ]; then
              echo "Submitted to the Chrome Web Store. It is now **in review**;"
              echo "for this extension that takes days, not minutes."
            else
              echo "Not submitted: no \`CWS_SERVICE_ACCOUNT\` secret configured."
              echo "The packaged zip is attached to this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The Helm chart, validated on every run and published as an OCI artifact on
  # pushes. Chart.yaml's committed `version`/`appVersion` are placeholders: the
  # numbers that ship come from the same resolver as the images, so a chart and
  # the image it defaults to always belong to the same build.
  chart:
    name: helm chart
    needs: [secrets, ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install_args keeps this to the two tools the chart needs — the full
      # toolchain (Rust, Node, typst) would cost minutes for a YAML lint. They
      # are pinned here rather than in mise.toml's [tools] so a developer who
      # never touches the chart does not download them on every `mise install`;
      # `mise run helm-lint` pins the same versions.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm@3.19.0 kubeconform@0.7.0

      # Renders the default install and the everything-on fixture, then checks
      # both against the real Kubernetes schemas. This is what catches a
      # mistyped field that YAML itself is perfectly happy with.
      - name: mise run helm-lint
        run: mise run helm-lint

      # Two channels, one registry:
      #
      #   * a TAG build publishes the plain version (2609.1.0). `helm install`
      #     with no --version resolves to the newest such chart, so "install
      #     the latest release" needs no version lookup by the operator.
      #   * a MAIN build publishes a SemVer PRERELEASE (2609.1.7-main.abc1234).
      #     Helm ignores prereleases when it resolves "latest" — verified
      #     against a registry, not assumed — so these are installable for
      #     testing (`--devel`, or an exact --version) without ever becoming
      #     what a normal install picks up.
      #
      # `--app-version` stays the plain number in both cases: it is what the
      # chart derives its image tags from, and the images are tagged
      # `v<plain version>`.
      - name: Package + push chart
        if: github.event_name != 'pull_request'
        env:
          V: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CHART_VERSION="$V"
          else
            CHART_VERSION="$V-main.$(git rev-parse --short HEAD)"
          fi
          # Helm keeps its own registry credentials (not ~/.docker/config.json),
          # so docker/login-action would not help it.
          echo "$GITHUB_TOKEN" | mise x helm@3.19.0 -- helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          mise x helm@3.19.0 -- helm package deploy/helm/llm-gateway \
            --version "$CHART_VERSION" --app-version "$V" --destination dist
          mise x helm@3.19.0 -- helm push "dist/llm-gateway-$CHART_VERSION.tgz" "$CHART_REPO"
          {
            echo "### Helm chart published"
            echo
            echo '```bash'
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "helm install llm-gateway ${CHART_REPO}/llm-gateway"
            else
              echo "helm install llm-gateway ${CHART_REPO}/llm-gateway --version $CHART_VERSION"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

