# CodeQL configuration for croit AIplane.
#
# The scanner runs through `.github/workflows/codeql.yml` (advanced setup) so
# this file is the source of truth. Test code is excluded by path: unit tests
# live in sibling `tests.rs` (and `*_tests.rs`) files, integration tests under
# `tests/`, and the SPA/e2e/extension suites use `*.test.*`. A deterministic
# test key, a test assertion that prints a fixture, or a reserved `*.invalid`
# URL is therefore not a production finding.
name: "AIplane CodeQL"

paths-ignore:
  - "crates/aiplane/tests/**"
  - "crates/**/tests/**"
  - "crates/**/tests.rs"
  - "crates/**/*_tests.rs"
  - "crates/**/common/mod.rs"
  - "web/**/*.test.ts"
  - "e2e/**"
  - "extension/**/*.test.*"
  - "clients/**/*.test.*"
  - "scripts/**/*.test.*"
