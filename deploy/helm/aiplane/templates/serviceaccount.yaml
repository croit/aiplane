{{- /*
SPDX-License-Identifier: AGPL-3.0-only
Copyright (C) 2026 croit GmbH

The gateway talks to no Kubernetes API, so this ServiceAccount exists only to
give the pod an identity of its own (for image-pull secrets, or for a cloud
provider's workload identity if backends are reached that way). Its token is
not mounted — see the StatefulSet.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiplane.serviceAccountName" . }}
  labels:
    {{- include "aiplane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
