#
# Everything switched on, so `mise run helm-lint` renders every template rather
# than just the four-object default install. Not a recommended configuration —
# a real deployment enables the connectors it actually uses. (`ci/*-values.yaml`
# is the conventional place for this; Helm's chart-testing picks the directory
# up automatically.)
publicUrl: https://aiplane.example.com

ingress:
  enabled: true
  className: nginx
  host: aiplane.example.com

sessionKey:
  existingSecret: aiplane-session

mcp:
  googleWorkspace:
    enabled: true
    existingSecret: gworkspace-oauth
    externalUrl: https://gworkspace-mcp.example.com
    allowedClientRedirectUris: https://aiplane.example.com/integrations/callback
    ingress:
      enabled: true
      className: nginx
      host: gworkspace-mcp.example.com
  gitlab:
    enabled: true
    apiUrl: https://gitlab.example.com/api/v4
  discord:
    enabled: true
    existingSecret: discord-bot

ocr:
  enabled: true
  image:
    repository: registry.example.com/aiplane-ocr
  vllmBaseUrl: http://unlimited-ocr.example.svc:8000/v1
