{{- /*
SPDX-License-Identifier: AGPL-3.0-only
Copyright (C) 2026 croit GmbH

The session key Secret. Skipped entirely when the operator brought their own.

`helm.sh/resource-policy: keep` is not decoration: a `helm uninstall` that took
this Secret with it would leave a perfectly intact database volume that nothing
can ever decrypt again. The PVC survives uninstall (StatefulSet
volumeClaimTemplates always do), so its key must too.
*/ -}}
{{- if not .Values.sessionKey.existingSecret }}
{{- if not (or .Values.sessionKey.value .Values.sessionKey.autoGenerate) }}
{{- fail "sessionKey: set sessionKey.existingSecret, or sessionKey.value, or leave sessionKey.autoGenerate=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.sessionSecretName" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  GATEWAY_SESSION_KEY: {{ include "llm-gateway.sessionKey" . | quote }}
{{- end }}
