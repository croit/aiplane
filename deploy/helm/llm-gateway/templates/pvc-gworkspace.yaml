{{- /*
SPDX-License-Identifier: AGPL-3.0-only
Copyright (C) 2026 croit GmbH

The Google Workspace MCP's OAuth store.

A small PVC of its own rather than a subPath on the gateway's volume, for two
reasons that both bite later otherwise:

  * a subPath directory is created by the kubelet owned by root and does NOT
    get the pod's fsGroup (kubernetes/kubernetes#95945), so the sidecar — which
    runs as its own non-root user — could not write to it; and
  * a StatefulSet's volumeClaimTemplates are immutable, so a second claim
    declared there could never be added to an existing install. A standalone
    PVC plus a volume in the (mutable) pod template can be enabled at any time.

`resource-policy: keep` because losing this store disconnects every user: it
holds the gateway's registered client, the authorization codes, the refresh
tokens the server issues and the upstream Google tokens.
*/ -}}
{{- if .Values.mcp.googleWorkspace.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-gateway.fullname" . }}-gworkspace-oauth
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode | quote }}]
  {{- with (.Values.mcp.googleWorkspace.persistence.storageClass | default .Values.persistence.storageClass) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mcp.googleWorkspace.persistence.size | quote }}
{{- end }}
