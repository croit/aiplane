{{- /*
SPDX-License-Identifier: AGPL-3.0-only
Copyright (C) 2026 croit GmbH

One Service for the whole pod. The Google Workspace MCP sidecar gets a second
port here because the browser has to reach it during OAuth consent; the GitLab
and Discord sidecars deliberately get none — the gateway reaches those over
localhost, and neither should ever be reachable from outside the pod (their
credentials are not scoped per caller).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.mcp.googleWorkspace.enabled }}
    - name: gworkspace-mcp
      port: {{ .Values.mcp.googleWorkspace.port }}
      targetPort: gworkspace
      protocol: TCP
    {{- end }}
  selector:
    {{- include "llm-gateway.selectorLabels" . | nindent 4 }}
