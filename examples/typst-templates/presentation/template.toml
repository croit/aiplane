id = "presentation"
# Human-readable label for the tool menu's "Document templates" section
# (optional; falls back to the prettified id). Distinct from `description`,
# which is written for the model.
title = "Slide deck"
description = """
Render a branded slide deck (16:9 PDF) in the sample house style — Urbanist \
type, dark/white surfaces, the brand gradient, glass cards, the logo. The deck \
is built from a SEQUENCE OF SLIDES; you pick a `layout` per \
slide and fill its fields, and the renderer applies all branding automatically. \
You never write Typst layout code — you fill the `deck` JSON; only a few prose \
fields take lightweight Typst markup (see MARKUP & ESCAPING below).

Before you build the deck, plan the narrative: a typical deck opens with a \
`cover`, may use `agenda`, groups content with `section` dividers, carries the \
message on `content`/`split`/`cards`/`stats`/`dashboard`/`comparison`/`process`/ \
`bignumber`/`quote`/`media`/`image`/`gallery`/`timeline`/`logos`/`team`/`table`/ \
`diagram`/`hbar`/`bar`/`line`/`donut`/`matrix`/`stack`/`findings`/`qa`/`objection`/ \
`actions`/`twocol`/`compose`, and ends with `closing`. ONE idea per slide. Keep \
it tight: ≤6 bullets, ≤4 cards/stats per row, ≤6 process steps, ≤8 table rows, \
≤8 chart categories (there is NO auto-pagination — content that overflows the \
slide height is simply cut off, so split long material across several slides).

THE `deck` FIELD IS A SINGLE JSON OBJECT (as a string):
  {
    "deck_title": "Example Corp — Product Overview",   // shown in every footer
    "footer_left": "example.com",                       // optional, defaults example.com
    "meta": { "author": "Jane Doe", "date": "Oct 2026", "confidential": true }, // optional, printed after footer-left
    "theme": "dark",                                  // "dark" (default) or "light"
    "slides": [ { "layout": "...", ... }, ... ]
  }

THEME: set it ONCE at the top (`"theme"`). Dark = anthracite background, white \
text, white logo. Light = white background, anthracite text, black logo. Do NOT \
mix — every slide uses the deck theme (a lone white slide in a dark deck looks \
like a mistake). Every layout renders identically in both themes.

GLOBAL OPTIONAL KEYS on any content slide: \
• `kicker` — a short ALL-CAPS section label shown top-right. \
• `takeaway` — ONE line of the slide's bottom line, printed in a full-width \
  gradient band reserved at the bottom of the content area (the body above it \
  gets the remaining height, so nothing overlaps). Add `takeaway_label` to \
  change the band's small ALL-CAPS label (defaults "TAKEAWAY"). Use it on \
  slides that land a claim — it is the deck's signature move. \
Footer + slide number are added automatically.

LAYOUTS AND THEIR FIELDS (✱ = required):
• cover — title slide. eyebrow?, title✱, title_line_2?, subtitle?, presenter?, role?, date?, bg_image?
• agenda — title?, items✱[{label✱, note?, page?}] (2–8). `page` = the slide number the section starts on, printed in the accent colour at the row's right edge.
• section — divider. number?, title✱, summary?, bg_image?
• content — workhorse text. title✱, subtitle?, tags? (array of short strings → a row of pill badges under the subtitle), and ONE of body (prose, blank-line-separated paragraphs) OR bullets[] (≤6, one line each)
• split — two columns. title✱, left_body?, left_bullets[]?, right_kind ("text"|"code"|"image"), right✱ (payload for that kind — text, code, or image path), frame? (true → wrap an image right side in a browser/device frame)
• cards — glass cards. title✱, card_style? ("glass" default | "gradient" = gradient-border cards), cards✱[{title✱, body✱, icon?, image?, link?}] (2–4). icon = the NAME of a built-in outline icon (one of: server, activity, trending-up, shield, database, bell, users, zap, cloud, lock, layers, clock, gauge, globe, rocket, check-circle, arrow-up-right) — rendered outline-only, white on dark / anthracite on light, per CI. image = a top banner photo (overrides icon). link = inline "learn more ↗" text at the card bottom (example.com product-card style).
• stats — big numbers (centred, no cards). title✱, stats✱[{value✱, label✱, note?, sub?}] (2–4). `note` = a short muted line under the label; `sub` = a second, smaller muted line (e.g. a unit, source or baseline).
• dashboard — a metrics dashboard: a row of glass metric CARDS, each with a label, a big gradient value, an optional trend and an optional sparkline. title✱, cards✱[{value✱, label✱, trend?, spark?}] (2–4). `value` = the metric (e.g. "99.98%", "1.24 PB"). `trend` = a SIGNED delta string ("+18%", "-2.1pt") — a leading "+" renders green, "-" renders peach, so choose the sign to match sentiment. `spark` = an array of ≥2 numbers drawn as a mini trend line at the card bottom. Prefer this over pasting a dashboard SCREENSHOT: it renders real numbers natively (crisp, on-brand, editable in the pptx export). Use `stats` instead when you only have bare figures with no trend/series.
• comparison — title✱, left✱{heading✱, points✱[]}, right✱{heading✱, points✱[]}, highlight ("left"|"right", default right; the highlighted side gets the gradient border)
• process — horizontal steps. title✱, steps✱[{label✱, detail?}] (2–6)
• bignumber — one hero metric. value✱, title✱, body?
• quote — quote✱, attribution✱, attribution_role?, style? ("default" = left, gradient text | "hero" = big white centred quote, the example.com hero look)
• media — image showcase, edge to edge. image? (omit → gradient + centred statement), title?, caption?, overlay_position? ("bottom-left"|"bottom-right"|"center"), size? ("small"|"medium"|"large"|"full"), frame? (true → centred screenshot inside a browser/device frame instead of full-bleed). TEXT IS NOT DRAWN ON THE PICTURE unless you ask for it: title/caption WITHOUT `overlay_position` get the clean `image` treatment (picture as large as it fits, title above it, caption below it) — which is what you want for a diagram, chart, screenshot or re-used slide, because those already carry their own labels and a headline dropped on top of them is unreadable. Set `overlay_position` ONLY for a photo/artwork with empty space in it, to put the glass caption panel ON the picture. Omit title AND caption for a pure edge-to-edge picture with nothing but the logo and footer on it. `size` shrinks the picture (anything other than "full" gives the clean sized slide). A picture too far off 16:9 to crop is never full-bleed — it is shown whole rather than losing a quarter of itself.
• image — ONE image alone on a clean slide: centred, NO browser chrome and NO text overlay (unlike full-bleed `media`), so the picture reads large and unobstructed. image✱, size? ("small"|"medium"|"large" (default)|"full" = all the free space), title? (above, in the flow), caption? (below), frame? (wrap in the browser chrome). The picture is scaled to the space that is actually free, so it always fits: whole, uncropped, and never spilling onto a second slide. Use this for a diagram/photo/chart that should dominate the slide without text on top of it.
• gallery — image grid. title✱, items✱[{image?, caption?}], per_row (default 3). Omitted image → gradient tile.
• timeline — vertical roadmap. title✱, milestones✱[{label✱, date?, detail?}]
• logos — "trusted by" wall. title✱, logos✱[strings], per_row (default 4)
• team — title✱, people✱[{name✱, role✱, avatar?}] (2–6)
• table — title✱, columns✱[strings], rows✱[[strings]] (each row MUST have one cell per column). Best on its own; ≤8 rows.
• diagram — flow. title✱, nodes✱[{label✱}], legend?
• statement — big centred line. title✱, eyebrow?, subtitle?, bg_image?, buttons?
• cta-panel — full-width brand-gradient callout band on a dark slide. kicker?, title✱, body?, buttons? (defaults to light+outline styles)
• closing — end/CTA. headline?, subline?, cta_label?, contact_name?, contact_email?, buttons?

CHARTS — native vector charts in the brand series colours (purple, peach, \
teal, dark-purple, cycled across series). All four take title✱ and an \
optional `caption` (one muted line under the chart). Series shape: \
`series✱[{name✱, values✱[numbers]}]` — 1–4 series, `values` aligned to \
`categories`.
• hbar — horizontal grouped bars, value labels at each bar end. Best when \
  category labels are long (benchmark/feature comparisons). title✱, \
  categories✱[strings] (3–8), series✱.
• bar — vertical grouped bars, value labels above each bar, optional \
  per-category gradient callout chips (e.g. "+13%") via `callouts` (array of \
  strings, same order as categories, "" = no chip). title✱, \
  categories✱[strings] (3–8), series✱, callouts?.
• line — line chart with point markers, 1–3 series, two gridlines. title✱, \
  categories✱[strings] (3–12, e.g. months/quarters), series✱.
• donut — donut (default) or pie: filled wedges in brand colours + a legend \
  with values and percentages. title✱, slices✱[{name✱, value✱}] (2–6), \
  style? ("donut" default | "pie"), center_label? (short text in the donut \
  hole, e.g. the total).

STRUCTURED CONTENT LAYOUTS:
• matrix — product rows × feature columns with ✓/✗/– marks. title✱, \
  columns✱[strings] (3–7), rows✱[{name✱, cells✱[strings]}] (2–6) — one cell per \
  column, "✓" supported / "✗" not / "–" partial. `highlight` (a row name) fills \
  that row with the brand gradient — use it for YOUR product. caption?.
• stack — vertical layer diagram, top layer first (e.g. the stack from UI to \
  infrastructure). title✱, layers✱[{label✱, note?}] (3–6, top→bottom order), \
  highlight? (a layer label → that layer gets the gradient card), side? (prose \
  for a glass panel beside the stack, e.g. "why this order").
• do-dont — two panels: green ✓ items vs peach ✕ items (best practices). \
  title✱, left✱{heading✱, points✱[] (3–5)}, right✱{heading✱, points✱[] (3–5)}.
• numbered-cards — a grid of glass cards numbered 01–06 in gradient. \
  title✱, cards✱[{title✱, body?}] (2–6), per_row? (default 3).
• persona — buyer/persona cards: avatar, name/role, pains & needs micro-lists, \
  an italic quote, and a gradient "message to us" band. title✱, \
  people✱[{name✱, role?, avatar?, pains[]?, needs[]?, pains_label? (default \
  "Pains"), needs_label? (default "Needs"), quote?, message?}] (2–3).
• findings — a dense numbered list with a detail line under each title \
  (audit results, research findings). title✱, items✱[{title✱, detail?}] (3–6).
• qa — two-column question cards: a purple "Q" + the question, then the \
  answer below. title✱, items✱[{q✱, a✱}] (2–6), per_row? (default 2).
• objection — objection→response rows: the objection in a soft peach box, the \
  response in the cell beside it. title✱, rows✱[{objection✱, response✱}] (3–6).
• actions — action plan table: numbered badge, action, owner, status pill. \
  title✱, rows✱[{action✱, owner?, status?}] (3–8). `status` = a short word \
  ("Now", "Next", "Q1") rendered as a pill.
• twocol — two (or three) independent text columns, each with a purple \
  heading, prose and/or bullets (current vs future, pros vs cons, regions). \
  title✱, cols✱[{heading?, body?, bullets?[]}] (2–3).
• compose — free stacking of branded content blocks in one slide: a `blocks` \
  array, each {type, …}, rendered at a compact scale and stacked top-to-bottom. \
  Block types: text{content}, bullets{items[]}, callout{label?, text}, \
  cards{cards[{title, body, icon?}], card_style?}, table{columns[], rows[][]}, \
  hbar/bar/line{categories[], series[{name, values[]}]}, donut{slices[{name, \
  value}], style?}, image{src, caption?}, quote{text, attribution?}, \
  stats{stats[{value, label}]}, process{steps[{label}]}, divider{}. title? \
  (omit for a block-only slide). Use it when a slide needs a MIX (e.g. three \
  stats + a short paragraph + a callout) that no single layout gives.

BUTTONS: cover, statement, cta-panel and closing accept a `buttons` array — \
each entry is either a string or {label✱, style?}. Styles mirror example.com: \
"primary" (gradient pill, white text — use on dark), "light" (white pill, \
purple text — use on the gradient panel), "outline" (transparent pill, white \
border — secondary). All render a pill with the ↗ arrow. `cta_label` is the \
single-button shortcut.

IMAGES: any image/avatar/bg_image/banner field takes EITHER (a) a file path \
string (PNG/JPEG/SVG) resolved relative to the template root — e.g. \
"assets/img/photo.png", if you add your own images under the template dir — OR \
(b) an `att:<turn>/<file>` ref that `fetch_attachment` \
returned in its `image_refs` for an image it pulled out of a document you were \
given. Copy that ref string VERBATIM into the field; the renderer fetches the \
real pixels and stages them automatically (do NOT invent a path for an uploaded \
image, and do NOT paste base64 — you cannot embed pixels in JSON). So when you \
rebuild an uploaded deck as branded slides, carry each source image over by \
dropping its `att:` ref into the matching slide's image field. \
Omitting an image always yields a clean gradient fallback, never a broken slide. \
Never put slide text ON a picture that carries text of its own (a diagram, a \
chart, a screenshot, a slide out of another deck): use `image`, or `media` \
without `overlay_position`, so the headline sits above the picture and the \
caption below it. \
BACKGROUNDS: this sample ships NO background art, so cover, section and \
statement render on the plain themed background by default; closing uses a full \
brand-gradient background. To use your own, set `bg_image` to an image path \
(text and logo turn white over it automatically); set `bg_image` to "none" to \
force the plain background. Content-type slides always stay on the flat themed \
background. The brand gradient direction is set in the template.

COPY RULES: Headlines short, action-oriented, headline case; body sentence \
case; kickers/section labels ALL CAPS. Warm, confident, "we" voice — no stiff \
corporate jargon.

MARKUP & ESCAPING — applies to the PROSE fields ONLY: `content` body, `content` \
bullets[], `cards[].body`, `split` left_body, `split` left_bullets[], `stack` \
side, `qa[].a`, `objection[].response`, `twocol[].body`, and in `compose` blocks \
the `text` content, `callout` text and `bullets` items. Those are rendered as \
native Typst markup (NOT Markdown); the renderer styles them in the brand \
automatically, so write plain Typst: inline emphasis \"*bold*\" with SINGLE \
asterisks (not **double**) and \"_italic_\" with SINGLE underscores; a line \
"- item" / "+ item" for a bullet / numbered list (but prefer the dedicated \
`bullets` arrays); a link \"#link(\"https://example.com\")[example.com]\". \
Separate paragraphs in a `body` with a blank line. EVERY OTHER field (titles, \
subtitles, eyebrows, kickers, quotes, attributions, stats values/labels, table \
cells, chart categories/series names/callouts/center_label, matrix marks, \
stack layer labels/notes, persona names/roles/pains/needs/messages, action \
owners/statuses, takeaway lines, `split` right text, buttons, captions, \
agenda/timeline/process labels) is PLAIN TEXT — write it literally, with NO \
markup and NO escaping. \
ESCAPING, in the prose fields ONLY — MANDATORY: because they are real Typst, \
five characters start Typst syntax and MUST each be preceded by a backslash \
EVERY time they appear as ordinary text, or the WHOLE deck fails to render (you \
get no slides at all, not just a wrong character): \
(1) \"@\" is THE most common trap — EVERY email address and @-handle must be \
escaped: write \"john\\@acme.com\", NEVER \"john@acme.com\"; an unescaped @ is \
read as a cross-reference and always crashes the render. \
(2) \"*\" — write \"5 \\* 3\". (3) \"#\" — write \"C\\#\", \"issue \\#42\". \
(4) \"$\" — write \"\\$5,000\", or spell it \"USD 5,000\". (5) the backtick \"`\" \
— escape it unless you deliberately want inline code. You do NOT need to escape \
underscores inside words/file names (my_var, config.txt), nor the characters \
% & [ ] < >. A backslash prints nothing itself; it just makes the next \
character literal. (In every OTHER field these characters print literally as-is \
— do not add backslashes there.)
"""
output_basename = "presentation"

# Editable PowerPoint export (via the code sandbox + typ2pptx). The deck
# content lives in the `deck` field; it is written to `deck.json`, which this
# template reads by default, then compiled to an editable .pptx. `font` is
# stamped onto the text runs (typ2pptx misclassifies Urbanist as monospace);
# Urbanist is a Google Font, so Google Slides renders it correctly on import.
[pptx]
data_field = "deck"
data_file = "deck.json"
font = "Urbanist"

[[field]]
name = "deck"
required = true
description = """
The entire presentation as a JSON object (passed as a string). Top-level keys: \
`deck_title` (string, shown in footers), `footer_left` (optional, default \
"example.com"), `meta` (optional, {author, date, confidential} — printed after \
footer-left in every footer), `theme` ("dark" default | "light", applied to the \
WHOLE deck), and `slides` (an array of slide objects). Each slide has a \
`layout` plus that layout's fields — see the full layout/field catalogue in \
this manifest's description. Build the slide sequence to tell one clear story, \
one idea per slide, and do not overflow a slide (no auto-pagination)."""

[[field]]
name = "theme"
required = false
description = """
Optional override of the deck-wide theme: "dark" (default) or "light". Normally \
leave this UNSET and set `"theme"` inside the `deck` JSON instead; this exists \
only to re-render the same deck in the other theme without editing the content. \
Dark = anthracite surfaces + white logo; light = white surfaces + black logo."""
