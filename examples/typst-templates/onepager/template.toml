id = "onepager"
# Human-readable label for the tool menu's "Document templates" section.
title = "Branded one-pager"
description = """
Render a branded one-pager / info sheet as a PDF on company stationery (logo, \
brand gradient, page footer — all built in). Use this for a NON-letter branded \
document: a product or program one-pager, a fact sheet, an announcement, a \
role/offer overview — anything that is NOT addressed to a specific recipient \
(for outgoing correspondence with a recipient, use `typst_letter`; for slides \
use `typst_presentation`).

You supply a title, an optional subtitle, and the content — as free-form \
`body` markup, a structured `blocks` array, or both (`body` renders first, then \
the blocks). Do NOT ask the user for the logo, colours, or company data — those \
are baked in. Never tell the user you lack the company logo: it is embedded in \
this template.
"""
output_basename = "onepager"

# Editable Word (.docx) export: convert the finished PDF to an editable
# .docx (pdf2docx, in the sandbox) and attach it alongside the PDF.
[docx]
# Brand font applied + embedded in the .docx export (from this template's own
# fonts/Urbanist-*.ttf); the export is typst -> HTML -> pandoc.
font = "Urbanist"

[[field]]
name = "title"
required = true
description = "The main headline of the one-pager, printed large at the top. Keep it short and punchy (a few words)."

[[field]]
name = "subtitle"
required = false
description = "Optional one-line subheading / tagline under the title (e.g. a short descriptor of what the sheet covers). Leave unset if there is nothing to add."

[[field]]
name = "body"
required = false
description = """
Free-form content in native Typst markup (NOT Markdown) — the original \
mechanism. Unlike a letter, a one-pager has NO salutation, date, or sign-off — \
just the content itself; the template supplies the header and footer. Separate \
paragraphs with a blank line. Use `body` for flowing prose, `blocks` for \
structured content (or both — body first, blocks after). \
The template styles it in the sample brand automatically, so just write plain \
Typst: Inline emphasis — \"*bold*\" with SINGLE asterisks (not **double**) and \
\"_italic_\" with SINGLE underscores. Headings, each on its own line — \
\"= Heading\" (large), \"== Heading\" (medium), \"=== Heading\" (small) — print \
in the brand colour. Lists — a line \"- item\" for a bullet or \"+ item\" for a \
numbered list; indent two spaces to nest. A pull-quote: \
\"#quote(block: true)[the quoted sentence]\" on its own line. A link: \
\"#link(\"https://example.com\")[example.com]\". For tabular data (features, \
prices, comparisons) write ONE Typst table call: #table with a columns count and \
one \"[cell]\" per cell, left-to-right, the first row of cells being the header \
(styled automatically), e.g. \"#table(columns: 2, [Feature], [Included], \
[Support], [Yes], [Onboarding], [Yes])\". Keep cell text short. \
ESCAPING LITERAL SYMBOLS — MANDATORY, READ CAREFULLY. Because the body is real \
Typst, five characters start Typst syntax and MUST each be preceded by a \
backslash EVERY time they appear as ordinary text — otherwise the WHOLE page \
fails to render (you get no document at all, not just a wrong character): \
(1) \"@\" is THE most common trap — EVERY email address and @-handle must be \
escaped: write \"john\\@acme.com\", NEVER \"john@acme.com\"; write \"\\@team\". \
An unescaped @ is read as a cross-reference and always crashes the render. \
(2) \"*\" — write \"5 \\* 3\" or \"cost \\* units\" (a stray * crashes too). \
(3) \"#\" — write \"C\\#\", \"issue \\#42\". \
(4) \"$\" — write \"\\$5,000\", or just spell it \"USD 5,000\" / \"EUR 5,000\". \
(5) the backtick \"`\" — escape it unless you deliberately want inline code. \
You do NOT need to escape underscores inside words or file names (my_var, \
config.txt render fine), nor the characters % & [ ] < > — those already print \
literally, so do not clutter the text with needless backslashes. Only escape a \
lone _ or * that you want to show as a literal symbol between spaces."""

[[field]]
name = "blocks"
required = false
description = """
Structured content as a JSON ARRAY of typed blocks (passed as a string) — the \
richer way to compose a one-pager. Each block is a JSON object with a `type` \
plus its fields; blocks render top-to-bottom in the page, each in the brand \
style. Supply AT LEAST ONE of `body` / `blocks` (never both empty). Block \
types: \
• section — {heading, body?} a brand-coloured subheading with optional prose \
  under it. \
• text — {content} a paragraph of native Typst markup (same escaping rules as \
  `body`). \
• bullets — {items[]} a branded bulleted list; items may carry inline Typst \
  markup. \
• stats — {stats[{value, label, note?}]} a row of soft brand-tinted \
  big-number callouts (2–4). \
• table — {columns[], rows[][]} a branded table (brand header row, light zebra \
  body); rows is an array of rows, each an array of cell strings. \
• cards — {cards[{title, body}]} a row of small titled cards (2–4); body may \
  carry inline Typst markup. \
• image — {src, size?, caption?} a centred picture; size = \"small\" (40%), \
  \"medium\" (65%), \"large\" (85%, default) or \"full\" (100%); src = an \
  `att:<turn>/<file>` attachment ref or a template-relative asset path. \
• quote — {text, attribution?} a pull quote with a brand left rule. \
• callout — {label?, text} a soft brand-tinted box with an optional \
  ALL-CAPS label; text may carry inline Typst markup. \
Prefer `blocks` for anything with numbers, tables, comparisons or a list of \
parallel items — it stays tidy and on-brand without you writing table/box code. \
Keep the whole sheet compact: it is a ONE-pager (aim for one page; long content \
may flow to a second)."""

[[field]]
name = "image"
required = false
description = """
Optional: ONE image to place in the one-pager — a photo, chart, diagram, \
screenshot, or logo. The value MUST be the attachment reference as its ENTIRE \
value: \"att:<turn>/<file>\" (get ids from `list_attachments`; fetch a web image \
with `load_image_url` first). Do NOT embed the ref inside the body text — it is \
only staged when it is the whole value of THIS field. The image flows in the \
page and never overlaps the text. Leave unset for no image. (For an image WITH \
a caption inside the content flow, an `image` block in `blocks` also works.)"""

[[field]]
name = "image_size"
required = false
description = """
How wide the `image` prints, relative to the text column: \"small\" (~40%), \
\"medium\" (~65%), \"large\" (~85%, the default), or \"full\" (100% — spans the \
whole content width for a near-full-page visual). Ignored when `image` is unset."""

[[field]]
name = "image_caption"
required = false
description = "Optional one-line caption printed under the `image` (small, muted italic). Leave unset for no caption."

[[field]]
name = "image_position"
required = false
description = """
Where the `image` sits relative to the body: \"bottom\" (after the body text, \
the default) or \"top\" (between the title and the body). Ignored when `image` \
is unset."""

[[field]]
name = "language"
required = false
description = """
Document language for correct typography (hyphenation / justification) only: \
\"en\" (English, the default) or \"de\" for a German one-pager. It does not \
translate anything — write the body yourself in whatever language the user \
asked for; the footer is generic."""
