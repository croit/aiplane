[package]
name = "aiplane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The binary and its routing glue: the rama router, the `/v1` proxy, the
# session-authed `/api/v0` JSON surface, the OIDC handlers, and `main`. The
# application body lives in `aiplane-core`, the HTML in `aiplane-api`; this
# crate only wires them to routes. Integration tests live here because they
# drive the router. See docs/architecture.md.

# The executable is `aiplane` — cargo infers it from the package name, so there
# is no [[bin]] block.

[dependencies]
aiplane-core = { path = "../aiplane-core" }
aiplane-features = { path = "../aiplane-features" }
aiplane-agents = { path = "../aiplane-agents" }
aiplane-runtime = { path = "../aiplane-runtime" }
aiplane-tools = { path = "../aiplane-tools" }
aiplane-api = { path = "../aiplane-api" }
shared = { path = "../shared" }
session-core = { path = "../session-core" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Rama HTTP framework — the router, middleware, and body extractors.
rama = { workspace = true }
# Form-body parsing for the form-encoded POST endpoints.
serde_urlencoded = { workspace = true }
# Multipart parsing for the `/v1/audio/transcriptions` upload path.
multer = { workspace = true }

tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# wiremock spins up an in-process HTTP mock that stands in for upstream
# LLM backends. Used by the integration tests in tests/ to exercise the
# proxy path end-to-end without needing a real model server.
wiremock = { workspace = true }
# `http-body-util::BodyExt::collect()` is the canonical "consume the
# rama Body into Bytes" call we need on the test side to inspect a
# response body. rama re-exports it but having the direct dev-dep
# makes the import obvious.
http-body-util = "0.1"
# Test-only: sign mock ID tokens with an RSA private key for the OIDC
# integration test. We feed the matching public key into the mock
# JWKS endpoint so our jsonwebtoken-based verifier accepts the token.
rsa = { version = "0.9", features = ["sha2"] }
# Test-only: the integration suite mints tokens/sessions directly and
# asserts on rendered page HTML, so it needs the same signing + templating
# crates the production paths use.
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
# Throwaway skill / RAG / typst-template roots for the fixtures that need a
# real directory on disk.
tempfile = { workspace = true }
# The RAG + embedding integration tests talk to their wiremock upstreams
# directly (not through the router) to seed and assert index state.
reqwest = { workspace = true }
# The mailing-list RAG test serves what HyperKitty serves: a gzipped mbox.
# Same crate the provider decompresses it with.
flate2 = "1.1"
# The embed tests implement the `AgentTurnRunner` seam with a test double;
# the trait is declared with `async_trait`.
async-trait = { workspace = true }

[lints]
workspace = true
