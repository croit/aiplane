[package]
name = "aiplane-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The request runtime: the tool API (Tool trait, ToolContext, registry, catalog,
# runner, MCP manager, sandbox client), `AppState`/`RamaState`, the streaming chat
# driver, and the workers that need state. `aiplane-tools` and `aiplane-api` both
# sit above this and neither depends on the other. See docs/architecture.md.

[dependencies]
aiplane-core = { path = "../aiplane-core" }
aiplane-features = { path = "../aiplane-features" }
shared = { path = "../shared" }
session-core = { path = "../session-core" }
async-trait = { workspace = true }
# Lock-free swap for the settings the setup wizard rewrites at runtime
# (`RuntimeSettings`), read on every request that builds an absolute URL.
arc-swap = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
base64 = "0.23"
tempfile = { workspace = true }
regex = { workspace = true }
# Rama wire types used by the driver and tool surface.
rama = { workspace = true }
# MCP client: stdio + streamable-HTTP transports.
#
# The `reqwest` feature stays enabled even though rmcp now shares the
# workspace's reqwest: it wanted 0.13 while the workspace was on 0.12, so
# Cargo resolved two of them and rmcp's copy had no TLS backend — every remote
# MCP connection failed with hyper's "invalid URL, scheme is not http". Since
# the workspace moved to 0.13 the two unify and the feature is probably
# redundant, but the failure it prevents is runtime-only and no test would
# catch a regression, so it is left on deliberately.
rmcp = { version = "3.4", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
