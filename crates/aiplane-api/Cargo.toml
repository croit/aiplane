[package]
name = "aiplane-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The gateway's browser-facing API layer: session-authenticated JSON handlers,
# the JSON-SSE chat stream, and the standalone OAuth callback documents. A
# pure sink — nothing below it (`aiplane-core`) references it, and only the
# router in `gateway` mounts it. Keeping it separate makes API edits a
# leaf-crate rebuild. See docs/architecture.md.

[dependencies]
# Shared HTTP client type: the /rag source form builds a provider from the
# submitted credentials to validate them, and the "Test connection" button
# drives a live probe through the gateway's own client pool.
aiplane-core = { path = "../aiplane-core" }
aiplane-features = { path = "../aiplane-features" }
aiplane-agents = { path = "../aiplane-agents" }
aiplane-runtime = { path = "../aiplane-runtime" }
shared = { path = "../shared" }
session-core = { path = "../session-core" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Rama HTTP framework — request/response types and SSE primitives.
rama = { workspace = true }
# Query-string encoding for safe login return paths.
serde_urlencoded = { workspace = true }
# Multipart parsing for file uploads (skill bundles, chat
# attachments, RAG document drops).
multer = { workspace = true }
# Logo uploads: decode the raster formats an operator drops on us and resize
# them before they land in the `branding` table. Already a workspace
# dependency (PDF rasterisation); no new external crate.
image = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
